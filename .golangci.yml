# golangci-lint v2 configuration
# See: https://golangci-lint.run/docs/configuration/file/

version: "2"

run:
  timeout: 5m

linters:
  default: standard
  disable:
    - unused       # 太多内部实现被误报
  enable:
    - bodyclose
    - copyloopvar
    - errorlint
    - gosec
    - misspell
    - noctx
    - prealloc
    - revive
    - unconvert
    - wastedassign
  settings:
    govet:
      enable-all: true
      disable:
        - fieldalignment
        - shadow       # 与 errcheck 重复，且误报较多
    revive:
      rules:
        - name: blank-imports
        - name: context-as-argument
        - name: context-keys-type
        - name: dot-imports
        - name: error-return
        - name: error-strings
        - name: error-naming
        - name: range
        - name: receiver-naming
        - name: time-naming
        - name: unexported-return
        - name: indent-error-flow
        - name: errorf
        - name: empty-block
        - name: superfluous-else
        - name: unreachable-code
    staticcheck:
      checks:
        - all
        - -SA1019   # allow use of deprecated things
        - -ST1000   # don't require package comments in every file
        - -ST1003   # don't enforce Id→ID / Json→JSON naming
    gosec:
      excludes:
        - G118       # context.WithCancel not called (stored in struct, called elsewhere)
        - G301       # directory permissions 0755 is intentional
        - G304       # file path from variable is necessary for drivers
        - G112       # ReadHeaderTimeout not needed for internal RPC server

  exclusions:
    generated: strict
    rules:
      # Exclude test files from noisy linters
      - path: _test\.go
        linters:
          - errcheck
          - gosec
          - noctx
          - funlen
          - gocognit
          - cyclop
      # Exclude cmd/ examples from noisy linters
      - path: cmd/
        linters:
          - errcheck
          - gosec
          - noctx
      # Exclude revive exported/unused-parameter from test files
      - path: _test\.go
        text: "unused-parameter"
      - path: _test\.go
        text: "exported"
      - linters:
          - revive
        text: "should have comment"
        path: _test\.go

formatters:
  enable:
    - gofmt
    - goimports
  settings:
    gofmt:
      simplify: true
  exclusions:
    generated: strict